services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: governr
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
  web:
    build:
      context: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/governr
      RISK_SCORING_SERVICE_URL: http://risk-scoring:4000

  risk-scoring:
    build:
      context: ./services/risk-scoring
    ports:
      - "4000:4000"
    volumes:
      - ./services/risk-scoring:/app
      - /app/node_modules
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/governr

volumes:
  db-data:
