services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: governr
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build:
      context: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/governr

  risk-scoring:
    build:
      context: ./services/risk-scoring
    ports:
      - "4000:4000"
    volumes:
      - ./services/risk-scoring:/app
      - /app/node_modules
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/governr

volumes:
  db-data:
